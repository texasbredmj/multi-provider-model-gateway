services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --maxmemory, 128mb, --maxmemory-policy, noeviction]
    ports: [127.0.0.1:16379:6379]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  providers:
    build: .
    command: [model_gateway.fixtures:app, --host, 0.0.0.0, --port, '8080']
    ports: [127.0.0.1:18670:8080]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    build: .
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set a generated local gateway API key}
      REDIS_URL: redis://redis:6379/0
      PROVIDER_ORIGIN: http://providers:8080
    ports: [127.0.0.1:18671:8080]
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
volumes:
  redis-data:
